name: Tests

on: [push, pull_request]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.2', '8.3', '8.4', '8.5']
        deps: [locked]
        include:
          - php: '8.2'
            deps: lowest
    name: PHP ${{ matrix.php }} (${{ matrix.deps }})
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          tools: composer, php-cs-fixer
          coverage: none
      - run: composer validate --strict
      - run: composer install --prefer-dist --no-progress
        if: matrix.deps == 'locked'
      - run: composer update --prefer-lowest --prefer-dist --no-progress
        if: matrix.deps == 'lowest'
      - run: vendor/bin/phpunit --no-coverage --colors=never
      - run: vendor/bin/phpstan analyse --no-interaction --no-ansi
      - run: vendor/bin/phpmd analyze src --format text --ruleset codesize --ruleset controversial --ruleset naming --ruleset unusedcode
      - run: vendor/bin/phpmd analyze tests --format text --ruleset codesize --ruleset controversial --ruleset design --exclude '*tests/Fixtures/*'
      - run: php-cs-fixer fix -v --config=.php-cs-fixer.dist.php --using-cache=no --dry-run
        if: matrix.deps == 'locked'
